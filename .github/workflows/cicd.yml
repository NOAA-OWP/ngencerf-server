name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
      - nwm-main
      - development
      - release-candidate
  push:
    branches:
      - main
      - nwm-main
      - development
      - release-candidate
  workflow_dispatch:
    inputs:
      NGEN_ORG:
        description: 'NGEN_ORG'
        required: false
        type: string
      NGEN_REF:
        description: 'NGEN_REF'
        required: false
        type: string
      MSW_MGR_ORG:
        description: 'MSW_MGR_ORG'
        required: false
        type: string
      MSW_MGR_REF:
        description: 'MSW_MGR_REF'
        required: false
        type: string
      DATA_ASSIMILATION_ORG:
        description: 'DATA_ASSIMILATION_ORG'
        required: false
        type: string
      DATA_ASSIMILATION_REF:
        description: 'DATA_ASSIMILATION_REF'
        required: false
        type: string
      NGEN_FORCING_ORG:
        description: 'NGEN_FORCING_ORG'
        required: false
        type: string
      NGEN_FORCING_REF:
        description: 'NGEN_FORCING_REF'
        required: false
        type: string
      EWTS_ORG:
        description: 'EWTS_ORG'
        required: false
        type: string
      EWTS_REF:
        description: 'EWTS_REF'
        required: false
        type: string

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: '3.12'
  BASE_NAME: python:3.12-slim-bookworm

jobs:
  # Build the ngencerf CLI executables. PyInstaller cannot cross-compile, so each
  # target OS builds on its own runner. Each binary is uploaded as an artifact and
  # baked into the server image by the build job below (which downloads them into
  # downloads/ before the docker build). Has no needs, so it starts immediately
  # alongside setup.
  build-cli:
    name: build-cli
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    # Old-glibc image used only to smoke-test the Linux binary (named here rather than
    # hardcoded in the step). The Linux binary is made portable by staticx inside
    # build_cli.sh, so running it on this image proves it loads with no system Python.
    env:
      CLI_SMOKE_IMAGE: amazonlinux:2
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          # macos-15-intel is a GitHub-hosted Intel (x86_64) runner.
          # build_cli.sh builds with --target-arch x86_64, and this runner's Python is x86_64,
          # so the binary runs on both Intel and Apple Silicon Macs via Rosetta 2.
          # An arm64 runner (macos-14 / macos-15 / macos-latest) would break --target-arch x86_64.
          - platform: macos
            runner: macos-15-intel
          - platform: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The `matrix` context is NOT available in a step's `shell:` key, so pick the
      # shell per-OS with `if: runner.os` and literal shell values (bash for
      # linux/macOS, pwsh for Windows). Do not put matrix.shell back here.
      - name: Build CLI executable (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash cli/build_cli.sh
      - name: Build CLI executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # build_cli.sh builds the PyInstaller onefile and then wraps it with staticx
          # into a fully static binary that runs on any glibc (Amazon Linux 2, RHEL 7+)
          # and musl. staticx needs objcopy (binutils) + patchelf on the host runner.
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils patchelf
          bash cli/build_cli.sh
      - name: Smoke-test Linux binary on old glibc
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Prove the freshly built binary loads and runs on CLI_SMOKE_IMAGE, an old-glibc
          # distro with no system Python. `ngencerf version` is local-only (no network).
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/downloads/latest/linux:/cli:ro" \
            "$CLI_SMOKE_IMAGE" \
            /cli/ngencerf version
      - name: Build CLI executable (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./cli/build_cli.ps1
      - name: Upload CLI artifact (${{ matrix.platform }})
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: downloads/
          if-no-files-found: error
          retention-days: 7

  # set variables to use in other jobs
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      org: ${{ steps.vars.outputs.org }}
      image_base: ${{ steps.vars.outputs.image_base }}
      commit_sha: ${{ steps.vars.outputs.commit_sha }}
      test_image_tag: ${{ steps.vars.outputs.test_image_tag }}
      alias_tag: ${{ steps.vars.outputs.alias_tag }}
      clean_ref: ${{ steps.vars.outputs.clean_ref }}
      base_name: ${{ steps.vars.outputs.base_name }}
      base_digest: ${{ steps.vars.outputs.base_digest }}
      base_revision: ${{ steps.vars.outputs.base_revision }}
      data_assimilation_revision: ${{ steps.vars.outputs.data_assimilation_revision }}
      ewts_revision: ${{ steps.vars.outputs.ewts_revision }}
      msw_mgr_revision: ${{ steps.vars.outputs.msw_mgr_revision }}
      ngen_revision: ${{ steps.vars.outputs.ngen_revision }}
      ngen_forcing_revision: ${{ steps.vars.outputs.ngen_forcing_revision }}
    steps:
      - name: Compute image vars
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          # ----------------------------------------------------------------
          # 1. Image identity: GHCR namespace (must be lowercase) + repo name
          # ----------------------------------------------------------------
          ORG="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO="$(basename "${GITHUB_REPOSITORY}")"
          IMAGE_BASE="${REGISTRY}/${ORG}/${REPO}"

          # ----------------------------------------------------------------
          # 2. Real ref + commit SHA. On a pull_request, github.ref points at
          #    the merge commit, so read the PR head ref/sha instead.
          # ----------------------------------------------------------------
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            REAL_REF="${{ github.head_ref }}"
            REAL_SHA="${{ github.event.pull_request.head.sha }}"
          else
            REAL_REF="${{ github.ref_name }}"
            REAL_SHA="${GITHUB_SHA}"
          fi
          CLEAN_REF=$(echo "$REAL_REF" | tr '[:upper:]' '[:lower:]' | sed 's/\//-/g')  # tag-safe ref
          SHORT_SHA="${REAL_SHA:0:7}"

          # ----------------------------------------------------------------
          # 3. Base image metadata for the OCI base.* labels. skopeo reads the
          #    remote manifest without pulling. base_revision is best-effort:
          #    base images that publish no revision label (e.g. python:3.12-slim-bookworm)
          #    stay "unknown"; base_digest still pins the exact base image.
          # ----------------------------------------------------------------
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          BASE_INSPECT=$(skopeo inspect --override-os linux --override-arch amd64 "docker://${BASE_NAME}")
          BASE_DIGEST=$(echo "$BASE_INSPECT" | jq -r '.Digest // "unknown"')
          BASE_REVISION=$(echo "$BASE_INSPECT" | jq -r '.Labels["org.opencontainers.image.revision"] // .Labels["io.noaa-owp.image.base.revision"] // "unknown"')

          # ----------------------------------------------------------------
          # 4. Source-dependency revisions. Resolve each dependency's ref
          #    (branch/tag/SHA) to the exact commit it points at right now.
          #    Each SHA is used TWICE downstream:
          #      - the io.ngwpc.<dep>.revision OCI label (traceability), and
          #      - the <DEP>_CACHE_BUST build-arg, which forces that exact
          #        commit to be (re)installed so a cached Docker layer cannot
          #        leave an older version baked in while the label claims the
          #        newer one.
          #    A *_REF override flows straight through here, so a non-default
          #    ref is honored for both the install and the label.
          # ----------------------------------------------------------------
          resolve_sha() {
            local url="$1" ref="$2" out sha
            # a full 40-char SHA is already a commit, not a ref to look up
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then echo "$ref"; return; fi
            out=$(git ls-remote "$url" "$ref" "refs/tags/${ref}^{}" 2>/dev/null || true)
            # prefer the dereferenced commit (^{}) for annotated tags; else the first match
            sha=$(echo "$out" | grep '\^{}$' | head -n1 | cut -f1 || true)
            [ -z "$sha" ] && sha=$(echo "$out" | head -n1 | cut -f1)
            echo "${sha:-unknown}"
          }

          DATA_ASSIMILATION_REVISION=$(resolve_sha "https://github.com/${{ inputs.DATA_ASSIMILATION_ORG || 'NOAA-OWP' }}/nwm-data-assimilation.git" "${{ inputs.DATA_ASSIMILATION_REF || 'development' }}")
          EWTS_REVISION=$(resolve_sha "https://github.com/${{ inputs.EWTS_ORG || 'NOAA-OWP' }}/nwm-ewts.git" "${{ inputs.EWTS_REF || 'development' }}")
          MSW_MGR_REVISION=$(resolve_sha "https://github.com/${{ inputs.MSW_MGR_ORG || 'NOAA-OWP' }}/nwm-msw-mgr.git" "${{ inputs.MSW_MGR_REF || 'development' }}")
          NGEN_REVISION=$(resolve_sha "https://github.com/${{ inputs.NGEN_ORG || 'NOAA-OWP' }}/ngen.git" "${{ inputs.NGEN_REF || 'development' }}")
          NGEN_FORCING_REVISION=$(resolve_sha "https://github.com/${{ inputs.NGEN_FORCING_ORG || 'NOAA-OWP' }}/ngen-forcing.git" "${{ inputs.NGEN_FORCING_REF || 'development' }}")

          # ----------------------------------------------------------------
          # 5. Image tags.
          #    test_image_tag: short SHA, used by the build + test stages.
          #    alias_tag: the promoted, human-readable tag:
          #      pull_request          -> pr-<number>-build
          #      workflow_dispatch tag -> the git tag
          #      branch push           -> <timestamp>-<branch>
          # ----------------------------------------------------------------
          TIMESTAMP=$(date -u +'%Y%m%d%H%M%SZ')
          TEST_TAG="${SHORT_SHA}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ALIAS="pr-${{ github.event.pull_request.number }}-build"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            ALIAS="${CLEAN_REF}"
          else
            ALIAS="${TIMESTAMP}-${CLEAN_REF}"
          fi

          # ----------------------------------------------------------------
          # 6. Publish outputs for the downstream jobs.
          # ----------------------------------------------------------------
          cat >> "$GITHUB_OUTPUT" <<EOF
          org=${ORG}
          image_base=${IMAGE_BASE}
          clean_ref=${CLEAN_REF}
          commit_sha=${REAL_SHA}
          test_image_tag=${TEST_TAG}
          alias_tag=${ALIAS}
          commit_sha=${REAL_SHA}
          commit_sha_short=${SHORT_SHA}
          clean_ref=${CLEAN_REF}
          base_name=${BASE_NAME}
          base_digest=${BASE_DIGEST}
          base_revision=${BASE_REVISION}
          data_assimilation_revision=${DATA_ASSIMILATION_REVISION}
          ewts_revision=${EWTS_REVISION}
          msw_mgr_revision=${MSW_MGR_REVISION}
          ngen_revision=${NGEN_REVISION}
          ngen_forcing_revision=${NGEN_FORCING_REVISION}
          EOF

  # CodeQL scan
  codeql-scan:
    name: codeql-scan
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # build ngencerf-server Dockerfile and Dockerfile.production-pw images
  build:
    name: build
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [setup, build-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            tag_suffix: "-dev"
          - dockerfile: Dockerfile.production-pw
            tag_suffix: "-prod"
    steps:
      - uses: actions/checkout@v6
      # Pull the OS-native CLI binaries built by build-cli into downloads/ so the
      # image bakes them in (COPY . ...) and the prod collectstatic step can serve
      # them. The Dockerfiles no longer build the CLI.
      - name: Download prebuilt CLI binaries
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: downloads
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (${{ matrix.dockerfile }}) image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ needs.setup.outputs.image_base }}:${{ needs.setup.outputs.test_image_tag }}${{ matrix.tag_suffix }}
          # Each *_REVISION is the dependency's resolved commit SHA (used by the
          # OCI labels). The matching *_CACHE_BUST is the same SHA, which busts
          # that dependency's install layer so the image always installs the
          # exact commit the label advertises (no stale/cached version).
          build-args: |
            NGEN_ORG=${{ inputs.NGEN_ORG || 'NOAA-OWP' }}
            NGEN_REF=${{ inputs.NGEN_REF || 'development' }}
            NGEN_REVISION=${{ needs.setup.outputs.ngen_revision }}
            MSW_MGR_ORG=${{ inputs.MSW_MGR_ORG || 'NOAA-OWP' }}
            NGEN_CACHE_BUST=${{ needs.setup.outputs.ngen_revision }}
            MSW_MGR_REF=${{ inputs.MSW_MGR_REF || 'development' }}
            MSW_MGR_REVISION=${{ needs.setup.outputs.msw_mgr_revision }}
            DATA_ASSIMILATION_ORG=${{ inputs.DATA_ASSIMILATION_ORG || 'NOAA-OWP' }}
            MSW_MGR_CACHE_BUST=${{ needs.setup.outputs.msw_mgr_revision }}
            DATA_ASSIMILATION_REF=${{ inputs.DATA_ASSIMILATION_REF || 'development' }}
            DATA_ASSIMILATION_REVISION=${{ needs.setup.outputs.data_assimilation_revision }}
            NGEN_FORCING_ORG=${{ inputs.NGEN_FORCING_ORG || 'NOAA-OWP' }}
            DATA_ASSIMILATION_CACHE_BUST=${{ needs.setup.outputs.data_assimilation_revision }}
            NGEN_FORCING_REF=${{ inputs.NGEN_FORCING_REF || 'development' }}
            NGEN_FORCING_REVISION=${{ needs.setup.outputs.ngen_forcing_revision }}
            EWTS_ORG=${{ inputs.EWTS_ORG || 'NOAA-OWP' }}
            NGEN_FORCING_CACHE_BUST=${{ needs.setup.outputs.ngen_forcing_revision }}
            EWTS_REF=${{ inputs.EWTS_REF || 'development' }}
            EWTS_REVISION=${{ needs.setup.outputs.ewts_revision }}
            EWTS_CACHE_BUST=${{ needs.setup.outputs.ewts_revision }}
            BASE_NAME=${{ needs.setup.outputs.base_name }}
            BASE_DIGEST=${{ needs.setup.outputs.base_digest }}
            BASE_REVISION=${{ needs.setup.outputs.base_revision }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            IMAGE_VENDOR=${{ github.repository_owner }}
            IMAGE_VERSION=${{ needs.setup.outputs.clean_ref }}
            IMAGE_REVISION=${{ needs.setup.outputs.commit_sha }}

# run unit tests inside the Docker images
  unit-test:
    name: unit-test
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag_suffix: "-dev"
          - tag_suffix: "-prod"
    container:
      image: ${{ needs.setup.outputs.image_base }}:${{ needs.setup.outputs.test_image_tag }}${{ matrix.tag_suffix }}
    steps:
      - name: Run unit tests
        run: |
          echo "TODO: add unit tests here"

  # run container security scan using Trivy
  container-scanning:
    name: container-scanning
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag_suffix: "-dev"
          - tag_suffix: "-prod"
    steps:
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          cache: true
          version: v0.69.3

      - name: Trivy scan
        env:
          TMPDIR: /mnt/trivy-temp
        run: |
          sudo mkdir -p $TMPDIR
          sudo chown -R $USER:$USER $TMPDIR

          trivy image \
            --format sarif \
            --output trivy-results${{ matrix.tag_suffix }}.sarif \
            --severity CRITICAL,HIGH \
            --scanners vuln \
            --ignore-unfixed \
            --timeout 45m \
            ${{ needs.setup.outputs.image_base }}:${{ needs.setup.outputs.test_image_tag }}${{ matrix.tag_suffix }}

  # promote Dockerfile.production-pw image tag after successful tests
  promote-tags:
    name: Promote Tags
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs:
      - setup
      - codeql-scan
      - build
      - unit-test
      - container-scanning
    steps:
      - name: Tag image with alias and latest
        shell: bash
        run: |
          set -euo pipefail

          # ensure skopeo is available for promotion
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends skopeo
          fi

          IMAGE_BASE="${{ needs.setup.outputs.image_base }}"
          TEST_TAG="${{ needs.setup.outputs.test_image_tag }}-prod"
          ALIAS_TAG="${{ needs.setup.outputs.alias_tag }}"

          # apply the primary alias (pr tag or timestamp-branch)
          skopeo copy \
            --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --all \
            "docker://${IMAGE_BASE}:${TEST_TAG}" "docker://${IMAGE_BASE}:${ALIAS_TAG}"

          # tag with 'latest' on development branch
          if [ "$GITHUB_REF_NAME" = "development" ]; then
            skopeo copy \
              --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              --all \
              "docker://${IMAGE_BASE}:${TEST_TAG}" "docker://${IMAGE_BASE}:latest"
          fi
