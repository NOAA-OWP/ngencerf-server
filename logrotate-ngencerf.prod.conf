# Logrotate config for ngencerf (production)
# Rotates logs under /ngencerf-app/logs/ngencerf-server.
#
# NOTE: We use two separate stanzas (one per log file) instead of a
# single stanza listing both files. In practice, combining them caused
# only the first file to rotate consistently while the second (db log)
# was skipped. Keeping them separate ensures both files always rotate.
#
# To trigger manually in production:
# $ /usr/sbin/logrotate ./logrotate-ngencerf.prod.conf
# (Do NOT use -f in normal operation; forced rotation increases
#  truncate/write race risk on NFS when using copytruncate.)


# Rotate the main application log
/ngencerf-app/logs/ngencerf-server/ngencerf.log {
    # always rotate when invoked (cron runs at 10:00 and 22:00)
    daily

    # keep 14 rotations
    rotate 14
    # don’t error if file missing
    missingok
    # don’t rotate empty logs
    notifempty
    sharedscripts

    # Avoid truncating very small or inactive files
    minsize 10M

    # Truncate in place so Django logging.FileHandler keeps its file descriptor.
    #
    # NOTE:
    # copytruncate on NFS with concurrent writers can very rarely introduce
    # leading NUL bytes due to truncate/write races. This configuration
    # minimizes (but cannot completely eliminate) that risk.
    copytruncate
    su root root

    # use date- and time-based rotation
    dateext
    dateformat _%Y-%m-%d_%H-%M
}


# Rotate the database log
/ngencerf-app/logs/ngencerf-server/ngencerf_db.log {
    # always rotate when invoked (cron runs at 10:00 and 22:00)
    daily

    # keep 14 rotations
    rotate 14
    # don’t error if file missing
    missingok
    # don’t rotate empty logs
    notifempty
    sharedscripts

    # Avoid truncating very small or inactive files
    minsize 10M

    # Truncate in place so Django logging.FileHandler keeps its file descriptor.
    copytruncate
    su root root

    # use date- and time-based rotation
    dateext
    dateformat _%Y-%m-%d_%H-%M
}
