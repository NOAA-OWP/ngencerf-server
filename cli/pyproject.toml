[project]
name = "ngencerf"
version = "0.1.0"
description = "Command-line tool for ngen calibration workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests~=2.33.1",
    "tabulate~=0.10.0",
    "PyYAML~=6.0.3",
    "qrcode~=8.2",
    "pillow~=12.2.0",
    "truststore~=0.10.4"
]

[project.scripts]
ngencerf = "ngencerf.run_cli:main"
